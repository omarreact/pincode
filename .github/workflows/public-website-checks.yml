name: Public website checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check public contact privacy and restored design
        run: npm run test:site
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build

  browser-qa:
    name: Real browser and responsive UI
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Build application in production mode
        run: npm run build
      - name: Check stock photos for permanent 404/410 errors
        run: npm run test:images
      - name: Verify pages, slider, navigation, responsive layouts and collect screenshots
        run: npm run test:browser
      - name: Upload browser screenshots, trace and performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse performance baseline
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    # The first baseline is informational until there are repeatable measurements.
    # Visual/interaction regressions ARE a required blocking check (browser-qa).
    continue-on-error: true
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production site
        run: npm run build
      - name: Confirm Chrome availability
        run: |
          command -v google-chrome || command -v google-chrome-stable || true
      - name: Collect Lighthouse reports
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - name: Upload Lighthouse JSON and HTML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-baseline-${{ github.run_id }}
          path: |
            .lighthouseci/
            lighthouse-report/
          if-no-files-found: ignore
          retention-days: 14
